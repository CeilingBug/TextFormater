<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Friendly Text</title>
  </head>
  <body id="page">
    <div style="text-align: right;" id="nav">
      <button id="contrast_button" onclick="contrast()">Light mode</button>
      <button id="format_button" onclick="Format()">Format text</button>
      <button id="font_button" onclick="changeFont()">Change font</button>
      <button id="big_button" onclick="Bigger()">Bigger text</button>
      <button id="small_button" onclick="Smaller()">Smaller text</button>
    </div>
    <div class="container">
      <textarea id="bigBox"></textarea>
    </div>
    <div id="output">
      <p id="output_text"></p>
    </div>
    <style>
      :root {
        --main-bg: white;
        --main-color: black;
        --text-size: 16px;
      }
      #output {
        margin: 10em auto;
        background-color: var(--main-bg);
        color: var(--main-color);
        text-align: left;
        font-size: var(--text-size);
        padding: 0 20%;
      }
      #page {
        background-color: var(--main-bg);
        color: var(--main-color);
        transition: background-color 0.5s ease, color 0.5s ease; /* transition?*/
      }
      .container {
        display: flex;
        justify-content: center;  /* horizontal centering */
        height: 25vh;            /* take full viewport height */
        background-color: var(--main-bg);
        color: var(--main-color);
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      #bigBox {
        margin: 3em;
        width: 70%;
        height: 25%;
        left: 0;
        bottom: 0;
        background-color: var(--main-bg);
        color: var(--main-color);
        font-size: 20px;
      }
      #nav {
        display: flex;
        justify-content: center;
        right: 0;
        top: 0;
        margin-right: 2em;
        margin-bottom: 2em;
        margin-top: 2em;
      }
      button {
        font-size: 20px;
        padding: 0.6em;
        margin-left: 1em;
        background-color: var(--main-bg);
        color: var(--main-color);
      }
    </style>
    <script>
      function contrast() {
            // grab the body
            let button = document.getElementById("contrast_button");
            // change the CSS
            if (button.innerText === "Light mode") {
              document.documentElement.style.setProperty('--main-bg', 'black');
              document.documentElement.style.setProperty('--main-color', 'white');
              button.innerText = "Dark mode";
            }
            else if (button.innerText === "Dark mode") {
              document.documentElement.style.setProperty('--main-bg', 'white');
              document.documentElement.style.setProperty('--main-color', 'black');
              button.innerText = "Light mode";
            }
        }
      function Bigger() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--text-size'); // e.g., "16px"
        let newSize = parseInt(currentSize) + 2 + "px";
        root.style.setProperty('--text-size', newSize);
      }
      function Smaller() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--text-size');
        let newSize = parseInt(currentSize) - 2 + "px";
        root.style.setProperty('--text-size', newSize);
      }
      function Format() {
        let textbox = document.GetElementById("bigBox");
        let output = document.GetElementById("output_text");
        output.innerText = textbox.value;
      }
    </script>
  </body>
</html>
