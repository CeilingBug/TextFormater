<!DOCTYPE html>
<html>
  <head>
    <meta charset="character_set">
    <title>Friendly Text</title>
  </head>
  <body id="page">
    <button onclick="contrast()">Change to light mode</button>
    <style>
      #page {
        background-color: white;
        color: black;
      }
    </style>
    <script>
      function contrast() {
            // grab the body
            let page = document.getElementById("page");

            // change the CSS
            page.style.backgroundColor = "black";
            page.style.color = "white";
        }
    </script>
  </body>
</html>
