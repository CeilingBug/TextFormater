<!DOCTYPE html>
<html>
  <head>
    <meta charset="character_set">
    <title>Friendly Text</title>
  </head>
  <body id="page">
    <button id="contrast_button" onclick="contrast()">Change to light mode</button>
    <textarea id="bigBox" rows="10" cols="50"></textarea>
    <style>
      #page {
        background-color: white;
        color: black;
      }
    </style>
    <script>
      function contrast() {
            // grab the body
            let page = document.getElementById("page");
            let button = document.getElementById("contrast_button")
            // change the CSS
            if (button.innerText = "Change to light mode") {
              page.style.backgroundColor = "black";
              page.style.color = "white";
              button.innerText = "Change to dark mode"
            }
            else if (button.innerText = "Change to dark mode") {
              page.style.backgroundColor = "white";
              page.style.color = "black";
              button.innerText = "Change to light mode"
            }
        }
    </script>
  </body>
</html>
