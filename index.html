<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Friendly Text</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend&family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.css">
  </head>
  <body id="page">
    <div style="text-align: right;" class="nav">
      <button id="contrast_button" class="big" onclick="contrast()">Light mode</button>
      <button id="read_button" class="big" onclick="readText()">Read Text</button>
      <select id="font_select" class="big" onchange="changeFont(this.value)">
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Century Gothic">Century Gothic</option>
        <option value="Trebuchet MS">Trebuchet MS</option>
        <option value="Comic Sans MS">Comic Sans</option>
        <option value="Lexend">Lexend</option>
        <option value="Roboto">Roboto</option>
        <option value="OpenDyslexicRegular">OpenDyslexic</option>
      </select>
      <button id="big_button" class="big" onclick="Bigger()">Bigger text</button>
      <button id="small_button" class="big" onclick="Smaller()">Smaller text</button>
      <button id="toggle_highlight" class="big" onclick="Highlight()">Highlight OFF</button>
      <button id="toggle_numbers" class="big" onclick="toggleLineNumbers()">Line Numbers OFF</button>
    </div>
    <div class="nav">
      <button id="bigline_button" class="small" onclick="BiggerLines()">+ line spacing</button>
      <button id="smallline_button" class="small" onclick="SmallerLines()">- line spacing</button>
      <button id="bigword_button" class="small" onclick="BiggerWords()">+ word spacing</button>
      <button id="smallword_button" class="small" onclick="SmallerWords()">- word spacing</button>
    </div>
    <div class="container">
      <textarea id="bigBox"></textarea>
    </div>
    <div id="output">
      <p id="output_text"></p>
    </div>
    <style>
      :root {
        --main-bg: white;
        --main-color: black;
        --text-size: 16px;
        --line-height: 1.8;
        --word-spacing: 0.1em;
        --high: #ffff99;
        --font-family: Arial, sans-serif;
      }

      * {
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      #output {
        background-color: var(--main-bg);
        color: var(--main-color);
        text-align: left;
        font-size: var(--text-size);
        padding: 0 20%;
        line-height: var(--line-height);       /* space between lines */
        word-spacing: var(--word-spacing);    /* space between words */
        font-family: var(--font-family);
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }
      #font_select {
        padding: 0.5em;
        margin-left: 1em;
        background-color: var(--main-bg);
        color: var(--main-color);
        border: 2px solid var(--main-color); /* thicker border */
        text-align: center;
        text-align-last: center;   
        font-family: var(--font-family);
      }
      #output_text {
        margin: 0;
        padding: 0;
      }
      #page {
        background-color: var(--main-bg);
        color: var(--main-color);
      }
      #bigBox {        
        width: 70%;        
        height: 25%;        
        left: 0;        
        bottom: 0;        
        margin: 0;         
        background-color: var(--main-bg);        
        color: var(--main-color);        
        font-family: var(--font-family);
      }
      .container {
        display: flex;        
        justify-content: center;  /* horizontal centering */        
        height: 25vh;            /* take full viewport height */        
        background-color: var(--main-bg);        
        color: var(--main-color);        
        margin-bottom: 0.5em; /* small gap below textarea */  
        height: auto;
      }
      .nav {
        display: flex;
        justify-content: center;
        right: 0;
        top: 0;
        margin-right: 2em;
        margin-bottom: 2em;
        margin-top: 2em;
      }
      button {
        padding: 0.6em;
        margin-left: 1em;
        background-color: var(--main-bg);
        color: var(--main-color);
        border-color: var(--main-color);
        font-family: var(--font-family);
      }
      .small {
        font-size: 15px;
      }
      .big {
        font-size: 16.5px;
      }
      .line {
        display: grid;
        grid-template-columns: 2em auto; /* gutter + text */
      }
      
      .line-number {
        text-align: right;
        margin-right: 0.5em;
        color: var(--main-color);
      }
      
      .line-text {
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .highlight {
        background-color: var(--high);
      }

    </style>
    <script>
      let highlight = false;
      let textarea = document.getElementById("bigBox");
      textarea.value = "Welcome to DYSLEX FRIENDLY.\nThis tool is designed to help make reading easier by allowing you to customize your viewing experience, such as fonts, colours, and spacing.\nPaste your text to begin!"
      function Highlight() {
        highlight = !highlight
        const button = document.getElementById("toggle_highlight");
        button.innerText = highlight ? "Highlight ON" : "Highlight OFF";
        Format()
      }
      function contrast() {
            // grab the body
            let button = document.getElementById("contrast_button");
            // change the CSS
            if (button.innerText === "Light mode") {
              document.documentElement.style.setProperty('--main-bg', 'black');
              document.documentElement.style.setProperty('--main-color', 'white');
              document.documentElement.style.setProperty('--high', '#2E5A60');
              button.innerText = "Dark mode";
              Format()
            }
            else if (button.innerText === "Dark mode") {
              document.documentElement.style.setProperty('--main-bg', '#72C0D3');
              document.documentElement.style.setProperty('--main-color', '#4A656B');
              document.documentElement.style.setProperty('--high', '#65DDF8');
              button.innerText = "Blue mode";
              Format()
            }
          else if (button.innerText === "Blue mode") {
              document.documentElement.style.setProperty('--main-bg', 'white');
              document.documentElement.style.setProperty('--main-color', 'black');
              document.documentElement.style.setProperty('--high', '#ffff99');
              button.innerText = "Light mode";
              Format()
            }
        }
      function changeFont(fontName) {
        document.documentElement.style.setProperty('--font-family', fontName);
        Format(); 
      }
      function Bigger() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--text-size'); // e.g., "16px"
        let newSize = parseInt(currentSize) + 2 + "px";
        root.style.setProperty('--text-size', newSize);
        Format()
      }
      function Smaller() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--text-size');
        let newSize = parseInt(currentSize) - 2 + "px";
        root.style.setProperty('--text-size', newSize);
        Format()
      }
      let showLineNumbers = false;

      function toggleLineNumbers() {
        showLineNumbers = !showLineNumbers;
        const button = document.getElementById("toggle_numbers");
        button.innerText = showLineNumbers ? "Line Numbers ON" : "Line Numbers OFF";
        Format(); // re-render output with/without numbers
      }

      function Format() {
        let textbox = document.getElementById("bigBox");
        let output = document.getElementById("output_text");
      
        let lines = textbox.value.split("\n");
      
        output.innerHTML = lines.map((line, index) => {
          // Always reserve gutter space
          let lineNumber = showLineNumbers
            ? `<span class="line-number">${index + 1}</span>`
            : `<span class="line-number"></span>`;
      
          // If line is empty, insert a non-breaking space so it still renders
          let safeLine = line.trim() === "" ? "&nbsp;" : line;
          let lineText = `<span class="line-text">${safeLine}</span>`;
      
          if (highlight && index % 2 === 1) {
            return `<div class="line highlight">${lineNumber}${lineText}</div>`;
          }
          return `<div class="line">${lineNumber}${lineText}</div>`;
        }).join("");
      }

      function BiggerLines() {
        let root = document.documentElement;
        let currentSize = parseFloat(getComputedStyle(root).getPropertyValue('--line-height'));
        let newSize = currentSize + 0.3;
        root.style.setProperty('--line-height', newSize); // line-height is unitless
        Format()
      }

      function SmallerLines() {
        let root = document.documentElement;
        let currentSize = parseFloat(getComputedStyle(root).getPropertyValue('--line-height'));
        if (currentSize > 1) { // avoid shrinking too much
          let newSize = currentSize - 0.3;
          root.style.setProperty('--line-height', newSize);
        }
        Format()
      }

      // WORD SPACING
      function BiggerWords() {
        let root = document.documentElement;
        let currentSize = parseFloat(getComputedStyle(root).getPropertyValue('--word-spacing'));
        let newSize = currentSize + 0.1; // smaller increments for readability
        root.style.setProperty('--word-spacing', newSize + "em");
        Format()
      }

      function SmallerWords() {
        let root = document.documentElement;
        let currentSize = parseFloat(getComputedStyle(root).getPropertyValue('--word-spacing'));
        if (currentSize > 0.1) { // avoid negative or zero spacing
          let newSize = currentSize - 0.1;
          root.style.setProperty('--word-spacing', newSize + "em");
        }
        Format()
        document.getElementById("bigBox").addEventListener("input", Format);
      }
      function readText() {
          let textbox = document.getElementById("bigBox");
          let text = textbox.value;
      
          if (!text) {
              alert("There's nothing to read!");
              return;
          }
      
          // Create a speech synthesis utterance
          let utterance = new SpeechSynthesisUtterance(text);
      
          // Optional settings
          utterance.lang = 'en-US'; // Language
          utterance.rate = 1;       // Speed (0.1 - 10)
          utterance.pitch = 1;      // Pitch (0 - 2)
          utterance.volume = 1;     // Volume (0 - 1)
      
          // Speak it
          window.speechSynthesis.speak(utterance);
      }
      Format()
      document.getElementById("bigBox").addEventListener("input", Format);
    </script>
  </body>
</html>
