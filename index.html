<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Friendly Text</title>
  </head>
  <body id="page">
    <div style="text-align: right;" class="nav">
      <button id="contrast_button" class="big" onclick="contrast()">Light mode</button>
      <button id="format_button" class="big" onclick="Format()">Format text</button>
      <button id="font_button" class="big" onclick="changeFont()">Change font</button>
      <button id="big_button" class="big" onclick="Bigger()">Bigger text</button>
      <button id="small_button" class="big" onclick="Smaller()">Smaller text</button>
    </div>
    <div class="nav">
      <button id="bigline_button" class="small" onclick="BiggerLines()">+ line spacing</button>
      <button id="smallline_button" class="small" onclick="SmallerLines()">- line spacing</button>
      <button id="bigword_button" class="small" onclick="BiggerWords()">+ word spacing</button>
      <button id="smallword_button" class="small" onclick="SmallerWords()">- word spacing</button>
    </div>
    <div class="container">
      <textarea id="bigBox"></textarea>
    </div>
    <div id="output">
      <p id="output_text"></p>
    </div>
    <style>
      :root {
        --main-bg: white;
        --main-color: black;
        --text-size: 16px;
        --line-height: 1.8;
        --word-spacing: 0.5em;
      }

      * {
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      #output {
        margin-top: 5px auto;
        background-color: var(--main-bg);
        color: var(--main-color);
        text-align: left;
        font-size: var(--text-size);
        padding: 0 20%;
        line-height: var(--line-height);       /* space between lines */
        word-spacing: var(--word-spacing);    /* space between words */
      }
      #page {
        background-color: var(--main-bg);
        color: var(--main-color);
      }
      .container {
        display: flex;
        justify-content: center;  /* horizontal centering */
        height: 25vh;            /* take full viewport height */
        background-color: var(--main-bg);
        color: var(--main-color);
      }
      #bigBox {
        margin: 3em;
        width: 70%;
        height: 25%;
        left: 0;
        bottom: 0;
        background-color: var(--main-bg);
        color: var(--main-color);
        font-size: 20px;
      }
      .nav {
        display: flex;
        justify-content: center;
        right: 0;
        top: 0;
        margin-right: 2em;
        margin-bottom: 2em;
        margin-top: 2em;
      }
      button {
        padding: 0.6em;
        margin-left: 1em;
        background-color: var(--main-bg);
        color: var(--main-color);
      }
      .small {
        font-size: 15px;
      }
      .big {
        font-size: 20px;
      }
    </style>
    <script>
      function contrast() {
            // grab the body
            let button = document.getElementById("contrast_button");
            // change the CSS
            if (button.innerText === "Light mode") {
              document.documentElement.style.setProperty('--main-bg', 'black');
              document.documentElement.style.setProperty('--main-color', 'white');
              button.innerText = "Dark mode";
            }
            else if (button.innerText === "Dark mode") {
              document.documentElement.style.setProperty('--main-bg', 'white');
              document.documentElement.style.setProperty('--main-color', 'black');
              button.innerText = "Light mode";
            }
        }
      function Bigger() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--text-size'); // e.g., "16px"
        let newSize = parseInt(currentSize) + 2 + "px";
        root.style.setProperty('--text-size', newSize);
      }
      function Smaller() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--text-size');
        let newSize = parseInt(currentSize) - 2 + "px";
        root.style.setProperty('--text-size', newSize);
      }
      function Format() {
        let textbox = document.getElementById("bigBox");   // lowercase 'g'
        let output = document.getElementById("output_text");
        output.innerText = textbox.value;
      }
      function BiggerLines() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--line-height'); // e.g., "1.8"
        let newSize = parseFloat(currentSize) + 0.3;
        root.style.setProperty('--line-height', newSize);
      }
      function SmallerLines() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--line-height'); // e.g., "1.8"
        let newSize = parseFloat(currentSize) - 0.3;
        root.style.setProperty('--line-height', newSize);
      }
      function BiggerWords() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--word-spacing'); // e.g., "1.8"
        let newSize = parseFloat(currentSize) + 0.3;
        root.style.setProperty('--word-spacing', newSize);
      }
      function SmallerWords() {
        let root = document.documentElement;
        let currentSize = getComputedStyle(root).getPropertyValue('--word-spacing'); // e.g., "1.8"
        let newSize = parseFloat(currentSize) - 0.3;
        root.style.setProperty('--word-spacing', newSize);
      }
    </script>
  </body>
</html>
